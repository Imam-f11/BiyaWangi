    <style>
      .flower-message {
        position: fixed;
        top: 25px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 430px;
        text-align: center;
        z-index: 99999;
        font-family: 'Segoe UI', sans-serif;
        line-height: 1.6;
        padding: 0 12px;
        pointer-events: none;
      }

      .flower-message span {
        display: block;
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 8px;
        text-shadow:
          0 0 5px #fff,
          0 0 10px #ff69b4,
          0 0 20px #ff1493,
          0 0 35px #ff1493;
        animation: glowText 2s ease-in-out infinite alternate !important;
      }

      .flower-message .music-info {
        font-size: 12px;
        margin-top: 6px;
        opacity: 0.9;
        color: #fff;
        text-shadow:
          0 0 5px #fff,
          0 0 10px #00eaff,
          0 0 20px #00eaff;
      }

      @keyframes glowText {
        from {
          opacity: 0.75;
          text-shadow:
            0 0 5px #fff,
            0 0 10px #ff69b4,
            0 0 20px #ff1493;
        }
        to {
          opacity: 1;
          text-shadow:
            0 0 8px #fff,
            0 0 18px #ff69b4,
            0 0 35px #ff1493,
            0 0 50px #ff1493;
        }
      }

      @media (max-width: 600px) {
        .flower-message {
          top: 18px;
          max-width: 330px;
        }

        .flower-message span {
          font-size: 13px;
          margin-bottom: 6px;
        }

        .flower-message .music-info {
          font-size: 11px;
        }
      }
    </style>
</head>

<audio id="music" preload="auto">
  <source src="./musik.mp3" type="audio/mpeg">
  Browser kamu tidak mendukung audio.
</audio>

<script>
  const music = document.getElementById("music");

  window.addEventListener("load", function () {
    const shouldPlay = sessionStorage.getItem("playMusic");

    if (shouldPlay === "yes") {
      music.volume = 0.8;

      music.play()
        .then(function () {
          console.log("Musik berhasil diputar dari tombol index");
          sessionStorage.removeItem("playMusic");
        })
        .catch(function (error) {
          console.log("Musik gagal autoplay:", error);
        });

      setTimeout(function () {
        music.pause();
        music.currentTime = 0;
      }, 60000);
    }
  });

  // Cadangan: kalau browser tetap blokir, klik layar bunga sekali
  document.addEventListener("click", function () {
    music.play().catch(function(error) {
      console.log("Musik masih gagal:", error);
    });
  });
</script>
